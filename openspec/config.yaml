schema: spec-driven

context: |
  Tech stack: Electron, React, Vite, TypeScript, pnpm.
  Code comment rule: functions over 40 lines must have a leading comment that explains intent, edge cases, or non-obvious behavior.
  Keep comments useful. Do not restate what the code already says.

